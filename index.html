
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English AI Master</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4fa;

}
header {

  color: white;

}

  background: white;
  margin: 18px;

}
button {
  background: #1769aa;
  color: white;

<header>

<p>تعلم الإنجليزية من الصفر</p>

<div class="card">

<p>ابدأ رحلتك التعليمية خطوة بخطوة.</p>
</div>

<div class="card">
<h2>الدرس الأول: التحيات</h2>
<p>Hello = مرحباً</p>
<p>Good morning = صباح الخير</p>
<p>Thank you = شكراً</p>

<button onclick="alert('أحسنت! استمر في التعلم')">
ابدأ التعلم
</button>
</div>

<div class="card">
<h2>اختبر معلوماتك</h2>

<button onclick="alert('إجابة صحيحة! أحسنت')">مرحباً</button>

<footer>
<p>English AI Master © 2026</p>
</footer>
